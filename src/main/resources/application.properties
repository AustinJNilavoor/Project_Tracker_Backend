# ================================================
# SERVER CONFIG
# ================================================
server.port=${PORT:8080}
spring.application.name=Project_Tracker

# ================================================
# DATABASE CONFIG (PostgreSQL)
# ================================================
# spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require
# spring.datasource.username=postgres.zbyegddazjhgfhhnmlcd
# spring.datasource.password=DPdllXZFv07k5k8v


spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

